<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AzureKart</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet"></head>
<body data-page="shop"><div id="nav"></div>
<header class="hero"><div class="container"><h1 class="fw-bold">Shop smarter, powered by Azure</h1><p class="lead mb-3">Every product you see is a JSON blob in Azure Blob Storage.</p>
<input id="q" class="form-control form-control-lg" style="max-width:520px" placeholder="Search products..."></div></header>
<main class="container my-4"><div id="grid" class="row g-4"></div></main>
<div class="offcanvas offcanvas-end" id="cart"><div class="offcanvas-header"><h5>Your cart</h5><button class="btn-close" data-bs-dismiss="offcanvas"></button></div>
<div class="offcanvas-body"><div id="cartBody"></div>
<form id="checkoutForm" class="mt-3 d-none"><h6>Checkout</h6>
<input class="form-control mb-2" name="cname" placeholder="Full name" required><input class="form-control mb-2" type="email" name="email" placeholder="Email" required>
<textarea class="form-control mb-2" name="address" placeholder="Delivery address" required></textarea><button class="btn btn-success w-100">Place order</button></form></div></div>
<div class="toast-container position-fixed bottom-0 end-0 p-3" id="toasts"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/app.js"></script><script src="js/products.js"></script></body></html>
